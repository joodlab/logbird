services:
  postgres:
    image: postgres:17-bookworm@sha256:665dc7b37ac52a17e298511414c21d23ffa4e6a6ef6225b3e5d59c7afb35e994
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logbird}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_POSTGRES:?}
      POSTGRES_DB: ${POSTGRES_DB:-logbird}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:26.9@sha256:925b0fbc8df74de7671404e688a4d99fd202910db3de8d524867e6f881c20be7
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-logbird}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logbird}
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_64_CLICKHOUSE:?}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./config/clickhouse-backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine@sha256:c5d34a98396a4775e223c74e929162c35c5a2182901ba26b50ade939941ce14b
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  # Published roles are pulled by default; docker-compose.build.yml opts into source builds.
  migrate:
    pull_policy: always
    image: ${LOGBIRD_IMAGE_REGISTRY:-ghcr.io/joodlab}/logbird-migrate:${LOGBIRD_VERSION:-0.1.1}
    environment: &runtime
      NODE_ENV: production
      APP_URL: ${APP_URL:-${SERVICE_URL_APP_4600:?}}
      BETTER_AUTH_SECRET: ${SERVICE_PASSWORD_64_AUTH:?}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-logbird}:${SERVICE_PASSWORD_64_POSTGRES:?}@postgres:5432/${POSTGRES_DB:-logbird}}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-logbird}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logbird}
      CLICKHOUSE_PASSWORD: ${SERVICE_PASSWORD_64_CLICKHOUSE:?}
      CLICKHOUSE_MAINTENANCE_MAX_EXECUTION_SECONDS: ${CLICKHOUSE_MAINTENANCE_MAX_EXECUTION_SECONDS:-600}
      CLICKHOUSE_QUERY_USER: logbird_query
      CLICKHOUSE_QUERY_PASSWORD: ${SERVICE_HEX_64_QUERY:?}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BULLMQ_PREFIX: '${BULLMQ_PREFIX:-{logbird}}'
      TRUST_PROXY: ${TRUST_PROXY:-2}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-600}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-3000}
      READ_RATE_LIMIT_PER_MINUTE: ${READ_RATE_LIMIT_PER_MINUTE:-1200}
      AUTH_LOG_SIGN_IN_CODES: ${AUTH_LOG_SIGN_IN_CODES:-false}
      AUTH_SIGNUP: ${AUTH_SIGNUP:-open}
      AUTH_SIGNUP_DOMAINS: ${AUTH_SIGNUP_DOMAINS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Logbird <hello@example.com>}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: 'no'
  server:
    pull_policy: always
    image: ${LOGBIRD_IMAGE_REGISTRY:-ghcr.io/joodlab}/logbird-server:${LOGBIRD_VERSION:-0.1.1}
    environment:
      <<: *runtime
      PORT: '4601'
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 45s
  worker:
    pull_policy: always
    image: ${LOGBIRD_IMAGE_REGISTRY:-ghcr.io/joodlab}/logbird-worker:${LOGBIRD_VERSION:-0.1.1}
    environment: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
      server: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 5m
  app:
    pull_policy: always
    image: ${LOGBIRD_IMAGE_REGISTRY:-ghcr.io/joodlab}/logbird-app:${LOGBIRD_VERSION:-0.1.1}
    environment:
      PORT: '4600'
      HOST: '0.0.0.0'
      NODE_ENV: production
      LOGBIRD_SERVER_URL: ${LOGBIRD_SERVER_URL:-http://server:4601}
      LOGBIRD_SITE_URL: ${LOGBIRD_SITE_URL:-}
      LOGBIRD_TERMS_URL: ${LOGBIRD_TERMS_URL:-}
      LOGBIRD_PRIVACY_URL: ${LOGBIRD_PRIVACY_URL:-}
      # Declared on the service that receives the domain, as in Coolify's examples: routes the public URL to app:4600.
      SERVICE_URL_APP_4600: ${SERVICE_URL_APP_4600}
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  clickhouse:
  redis:
