services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logbird}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-logbird}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-logbird}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logbird}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes: [clickhouse:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    image: ${LOGBIRD_IMAGE_REGISTRY:-logbird}/migrate:${LOGBIRD_VERSION:-local}
    build: {context: ., dockerfile: apps/server/Dockerfile, target: migrate}
    environment: &runtime
      NODE_ENV: production
      APP_URL: ${APP_URL:-http://localhost:4600}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Run sh scripts/selfhost-init.sh}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-logbird}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-logbird}}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-logbird}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-logbird}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_QUERY_USER: logbird_query
      CLICKHOUSE_QUERY_PASSWORD: ${CLICKHOUSE_QUERY_PASSWORD:?Run sh scripts/selfhost-init.sh}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      BULLMQ_PREFIX: '${BULLMQ_PREFIX:-{logbird}}'
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-}
      AUTH_RATE_LIMIT_PER_MINUTE: ${AUTH_RATE_LIMIT_PER_MINUTE:-30}
      PUBLIC_RATE_LIMIT_PER_MINUTE: ${PUBLIC_RATE_LIMIT_PER_MINUTE:-600}
      INGEST_RATE_LIMIT_PER_MINUTE: ${INGEST_RATE_LIMIT_PER_MINUTE:-3000}
      READ_RATE_LIMIT_PER_MINUTE: ${READ_RATE_LIMIT_PER_MINUTE:-1200}
      AUTH_LOG_SIGN_IN_CODES: ${AUTH_LOG_SIGN_IN_CODES:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-Logbird <hello@example.com>}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: 'no'
  server:
    image: ${LOGBIRD_IMAGE_REGISTRY:-logbird}/server:${LOGBIRD_VERSION:-local}
    build: {context: ., dockerfile: apps/server/Dockerfile}
    environment:
      <<: *runtime
      PORT: '4601'
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    stop_grace_period: 45s
  worker:
    image: ${LOGBIRD_IMAGE_REGISTRY:-logbird}/worker:${LOGBIRD_VERSION:-local}
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    environment: *runtime
    depends_on:
      migrate: {condition: service_completed_successfully}
      server: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 5m
  app:
    image: ${LOGBIRD_IMAGE_REGISTRY:-logbird}/app:${LOGBIRD_VERSION:-local}
    build: {context: ., dockerfile: apps/app/Dockerfile}
    environment:
      PORT: '4600'
      HOST: '0.0.0.0'
      NODE_ENV: production
      LOGBIRD_SERVER_URL: ${LOGBIRD_SERVER_URL:-http://server:4601}
    ports: ['${LOGBIRD_BIND:-127.0.0.1}:${LOGBIRD_HTTP_PORT:-4600}:4600']
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: caddy:2.10.2-alpine
    profiles: [tls]
    environment:
      LOGBIRD_DOMAIN: ${LOGBIRD_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports: ['${LOGBIRD_TLS_HTTP_PORT:-80}:80', '${LOGBIRD_TLS_HTTPS_PORT:-443}:443']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
volumes:
  postgres:
  clickhouse:
  redis:
  caddy_data:
  caddy_config:
