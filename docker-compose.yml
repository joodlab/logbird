services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trailmark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-trailmark}
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  clickhouse:
    image: clickhouse/clickhouse-server:26.9
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-trailmark}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-trailmark}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    volumes: [clickhouse:/var/lib/clickhouse]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    healthcheck:
      test: [CMD, wget, --spider, -q, 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  server:
    build: {context: ., dockerfile: apps/server/Dockerfile}
    env_file: .env
    environment: {PORT: '4601', NODE_ENV: production}
    depends_on:
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 45s
  worker:
    build: {context: ., dockerfile: apps/worker/Dockerfile}
    env_file: .env
    environment: {NODE_ENV: production}
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
    stop_grace_period: 5m
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args: {TRAILMARK_SERVER_URL: 'http://server:4601'}
    env_file: .env
    environment: {PORT: '4600', HOST: '0.0.0.0', NODE_ENV: production}
    ports: ['127.0.0.1:4600:4600']
    depends_on:
      server: {condition: service_healthy}
    restart: unless-stopped
  mailpit:
    image: axllent/mailpit:v1.27
    profiles: [mail]
    ports: ['127.0.0.1:8025:8025']
volumes:
  postgres:
  clickhouse:
  redis:
