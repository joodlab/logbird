apiVersion: v1
kind: ConfigMap
metadata:
  name: logbird-config
  namespace: logbird
data:
  NODE_ENV: production
  APP_URL: https://audit.example.test
  CLICKHOUSE_DATABASE: logbird
  CLICKHOUSE_QUERY_USER: logbird_query
  BULLMQ_PREFIX: '{logbird}'
  # One ingress proxy plus the app proxy. Verify the actual forwarding chain.
  TRUST_PROXY: '2'
  AUTH_LOG_SIGN_IN_CODES: 'false'
  SMTP_PORT: '465'
  SMTP_SECURE: 'true'
  MAIL_FROM: Logbird <hello@example.test>
