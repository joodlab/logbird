apiVersion: apps/v1
kind: Deployment
metadata:
  name: logbird-server
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: logbird-server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: logbird-server}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: scratch, emptyDir: {sizeLimit: 64Mi}}]
      containers:
        - name: server
          image: registry.invalid/logbird/server:unconfigured
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: scratch, mountPath: /tmp}]
          ports: [{name: http, containerPort: 4601}]
          envFrom:
            - configMapRef: {name: logbird-config}
            - secretRef: {name: logbird-runtime}
          env: [{name: PORT, value: '4601'}, {name: TMPDIR, value: /tmp}]
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 64Mi}
            limits: {cpu: '2', memory: 1Gi, ephemeral-storage: 128Mi}
          startupProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: logbird-server
spec:
  selector: {app.kubernetes.io/name: logbird-server}
  ports: [{name: http, port: 4601, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logbird-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: logbird-app}
  template:
    metadata:
      labels: {app.kubernetes.io/name: logbird-app}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: scratch, emptyDir: {sizeLimit: 64Mi}}]
      containers:
        - name: app
          image: registry.invalid/logbird/app:unconfigured
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: scratch, mountPath: /tmp}]
          ports: [{name: http, containerPort: 4600}]
          env:
            - {name: NODE_ENV, value: production}
            - {name: HOST, value: '0.0.0.0'}
            - {name: PORT, value: '4600'}
            - {name: LOGBIRD_SERVER_URL, value: 'http://logbird-server:4601'}
            - {name: TMPDIR, value: /tmp}
          resources:
            requests: {cpu: 250m, memory: 256Mi, ephemeral-storage: 64Mi}
            limits: {cpu: '1', memory: 768Mi, ephemeral-storage: 128Mi}
          startupProbe:
            tcpSocket: {port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: logbird-app
spec:
  selector: {app.kubernetes.io/name: logbird-app}
  ports: [{name: http, port: 4600, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logbird-worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: logbird-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: logbird-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 300
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      volumes: [{name: scratch, emptyDir: {sizeLimit: 64Mi}}]
      containers:
        - name: worker
          image: registry.invalid/logbird/worker:unconfigured
          imagePullPolicy: IfNotPresent
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: scratch, mountPath: /tmp}]
          env:
            - {name: NODE_ENV, valueFrom: {configMapKeyRef: {name: logbird-config, key: NODE_ENV}}}
            - {name: CLICKHOUSE_DATABASE, valueFrom: {configMapKeyRef: {name: logbird-config, key: CLICKHOUSE_DATABASE}}}
            - {name: BULLMQ_PREFIX, valueFrom: {configMapKeyRef: {name: logbird-config, key: BULLMQ_PREFIX}}}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: logbird-worker, key: DATABASE_URL}}}
            - {name: CLICKHOUSE_URL, valueFrom: {secretKeyRef: {name: logbird-worker, key: CLICKHOUSE_URL}}}
            - {name: CLICKHOUSE_USER, valueFrom: {secretKeyRef: {name: logbird-worker, key: CLICKHOUSE_USER}}}
            - {name: CLICKHOUSE_PASSWORD, valueFrom: {secretKeyRef: {name: logbird-worker, key: CLICKHOUSE_PASSWORD}}}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: logbird-worker, key: REDIS_URL}}}
            - {name: TMPDIR, value: /tmp}
          resources:
            requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 64Mi}
            limits: {cpu: '2', memory: 1Gi, ephemeral-storage: 128Mi}
          # Dependency probe only; no restart-on-storage-failure liveness probe.
          readinessProbe:
            exec: {command: [node, dist/health.mjs]}
            periodSeconds: 30
            timeoutSeconds: 15
