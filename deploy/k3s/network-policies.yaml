apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: logbird
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: logbird
  name: ingress-to-app
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: logbird-app}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 4600}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  namespace: logbird
  name: app-to-server
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: logbird-server}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: logbird-app}
      ports: [{protocol: TCP, port: 4601}]
