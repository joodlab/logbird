name: npm packages

# Packs the TypeScript packages exactly as a release does (the same reusable workflow, npm-tarballs.yml), checks the
# tarballs, installs them into outside applications (tests/npm-consumer, tests/npm-consumer-adapters,
# tests/npm-release-install) that type-check, run and report the public API from the tarballs, never from the workspace
# sources, and shows the asset set a release would attach. Nothing is published here.
on:
  pull_request:
    paths:
      - 'packages/sdk/**'
      - 'packages/integrations/**'
      - 'packages/contracts/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tests/npm-consumer/**'
      - 'tests/npm-consumer-adapters/**'
      - 'scripts/check-npm-packages.mjs'
      - 'scripts/check-npm-packages.test.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/npm-packages.yml'
      - 'tests/npm-release-install/**'
      - 'scripts/npm-release-assets.mjs'
      - 'scripts/npm-release-assets.test.mjs'
      - '.github/workflows/npm-tarballs.yml'
  push:
    branches: [master]
    paths:
      - 'packages/sdk/**'
      - 'packages/integrations/**'
      - 'packages/contracts/**'
      - 'packages/tsconfig/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'tests/npm-consumer/**'
      - 'tests/npm-consumer-adapters/**'
      - 'scripts/check-npm-packages.mjs'
      - 'scripts/check-npm-packages.test.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/npm-packages.yml'
      - 'tests/npm-release-install/**'
      - 'scripts/npm-release-assets.mjs'
      - 'scripts/npm-release-assets.test.mjs'
      - '.github/workflows/npm-tarballs.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  npm:
    name: npm
    permissions:
      contents: read
    uses: ./.github/workflows/npm-tarballs.yml
