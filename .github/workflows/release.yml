name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: logbird-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Third-party release tooling runs in this job; don't leave the token in .git/config.
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify tag, versions, master ancestry and Quality
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-preflight.mjs
      - name: Resolve version
        id: version
        run: echo "version=$(node scripts/check-version-consistency.mjs "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
      - name: Install release tooling
        # No lifecycle scripts run in this job, which holds GH_TOKEN.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify release tooling
        run: node --test scripts/release-notes.test.mjs scripts/release-preflight.test.mjs
      - name: Generate reviewed release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-notes.mjs --version "$GITHUB_REF_NAME" --to "$GITHUB_REF_NAME" --output release-notes.md
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: Build ${{ matrix.role }} (${{ matrix.arch }})
    needs: preflight
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role: [server, worker, app, migrate]
        arch: [amd64, arm64]
        include:
          - {role: server, dockerfile: apps/server/Dockerfile, target: runtime}
          - {role: worker, dockerfile: apps/worker/Dockerfile, target: runtime}
          - {role: app, dockerfile: apps/app/Dockerfile, target: runtime}
          - {role: migrate, dockerfile: apps/server/Dockerfile, target: migrate}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/joodlab/logbird-${{ matrix.role }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/joodlab/logbird-${{ matrix.role }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=release-${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.role }}-${{ matrix.arch }}
      - name: Record platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "The build returned no valid image digest" >&2
            exit 1
          fi
          printf '%s\n' "$DIGEST" > "${{ matrix.arch }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.role }}-${{ matrix.arch }}
          path: ${{ matrix.arch }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  images:
    name: Publish ${{ matrix.role }}
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        role: [server, worker, app, migrate]
    env:
      IMAGE: ghcr.io/joodlab/logbird-${{ matrix.role }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-${{ matrix.role }}-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Publish multi-platform image and record index digest
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ needs.preflight.outputs.version }}
        shell: bash
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "digests/$arch.txt")
            if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "Invalid image digest for $arch" >&2
              exit 1
            fi
            sources+=("$IMAGE@$digest")
          done

          # Publish the exact version first. The moving aliases (X.Y, latest) only follow once the
          # published index is verified, so a wrong index never reaches users who pull an alias.
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "${sources[@]}"

          docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' > index.json
          digest=$(jq -er '.digest' index.json)
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid index digest for $IMAGE:$VERSION" >&2
            exit 1
          fi
          platforms=$(jq -r '[.manifests[] | select(.platform.os == "linux") | .platform.architecture] | sort | join(",")' index.json)
          if [[ "$platforms" != "amd64,arm64" ]]; then
            echo "Expected linux/amd64 and linux/arm64 in $IMAGE:$VERSION, found: $platforms" >&2
            exit 1
          fi

          # The tag list can name an alias twice (the semver rule and the explicit latest rule both
          # produce "latest"), so each alias is passed once.
          alias_args=()
          declare -A seen=()
          version_tagged=false
          while IFS= read -r tag; do
            if [[ -z "$tag" || -n "${seen[$tag]:-}" ]]; then
              continue
            fi
            seen[$tag]=1
            if [[ "$tag" == "$IMAGE:$VERSION" ]]; then
              version_tagged=true
            else
              alias_args+=(--tag "$tag")
            fi
          done <<< "$TAGS"
          if [[ "$version_tagged" != true ]]; then
            echo "The tag list does not contain $IMAGE:$VERSION" >&2
            exit 1
          fi
          if (( ${#alias_args[@]} > 0 )); then
            docker buildx imagetools create "${alias_args[@]}" "$IMAGE@$digest"
          fi
          printf '%s:%s@%s\n' "$IMAGE" "$VERSION" "$digest" > "image-${{ matrix.role }}.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.role }}
          path: image-${{ matrix.role }}.txt
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [preflight, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
      - uses: actions/download-artifact@v8
        with:
          pattern: image-*
          merge-multiple: true
      - name: Assemble image receipt
        run: cat image-*.txt > images.txt
      - name: Create release after all images publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" images.txt \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Logbird $GITHUB_REF_NAME" --notes-file release-notes.md

  nuget:
    name: Publish NuGet packages
    needs: [preflight, release]
    # The first NuGet publication is the maintainers' decision after the pre-publication gate, not a side effect of a tag.
    # Publishing needs the Actions variable NUGET_PUBLISH_ENABLED (a repository variable, or an organization variable
    # shared with this repository when the repository defines none) set to exactly `true` (checked case-sensitively
    # below; this job-level condition only skips the job early) and the NUGET_API_KEY secret. Package versions are the
    # release version.
    if: vars.NUGET_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      # Not named VERSION: MSBuild reads environment variables as properties, and Version would override the package version.
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - name: Require publication to be enabled and the NuGet API key
        id: gate
        env:
          ENABLED: ${{ vars.NUGET_PUBLISH_ENABLED }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ "$ENABLED" != "true" ]; then
            echo "::notice::NUGET_PUBLISH_ENABLED is not exactly 'true'; no NuGet package is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_PUBLISH_ENABLED is set, but the NUGET_API_KEY secret is missing; no NuGet package is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.publish == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        if: steps.gate.outputs.publish == 'true'
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Package validation compares each package with PackageValidationBaselineVersion; that baseline must be the latest
      # version already on nuget.org, or a breaking change to it would pass unseen (sdks/dotnet/CONTRIBUTING.md).
      - name: Package validation compares with the latest published version
        if: steps.gate.outputs.publish == 'true'
        working-directory: sdks/dotnet
        run: |
          for project in Logbird Logbird.AspNetCore; do
            baseline="$(dotnet msbuild "src/$project/$project.csproj" -getProperty:PackageValidationBaselineVersion)"
            python3 check-validation-baseline.py "$RELEASE_VERSION" "$baseline" "$project"
          done
      - name: Build, test and pack the released version
        if: steps.gate.outputs.publish == 'true'
        working-directory: sdks/dotnet
        run: |
          dotnet build Logbird.slnx -c Release
          dotnet test Logbird.slnx -c Release --no-build
          dotnet pack src/Logbird/Logbird.csproj -c Release --no-build -o "$RUNNER_TEMP/nupkg"
          dotnet pack src/Logbird.AspNetCore/Logbird.AspNetCore.csproj -c Release --no-build -o "$RUNNER_TEMP/nupkg"
          # The packed manifests, not the build inputs, must carry the release version.
          for id in Logbird Logbird.AspNetCore; do
            package="$RUNNER_TEMP/nupkg/$id.$RELEASE_VERSION.nupkg"
            test -f "$package" || { echo "::error::$id was not packed as $RELEASE_VERSION."; ls "$RUNNER_TEMP/nupkg"; exit 1; }
            test -f "$RUNNER_TEMP/nupkg/$id.$RELEASE_VERSION.snupkg" || { echo "::error::$id has no symbol package."; exit 1; }
            packed="$(unzip -p "$package" "$id.nuspec" | sed -n 's:.*<version>\(.*\)</version>.*:\1:p' | head -1)"
            if [ "$packed" != "$RELEASE_VERSION" ]; then
              echo "::error::$id.nuspec has version '$packed', not the release version $RELEASE_VERSION."
              exit 1
            fi
          done
      - name: Push Logbird, then wait until nuget.org serves it
        if: steps.gate.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        # Logbird.AspNetCore depends on Logbird, so it is pushed only once Logbird has passed nuget.org's validation and
        # can be downloaded. Packages and symbol packages are pushed separately, each skipping a version already there, so
        # a rerun completes whatever an earlier run left out.
        run: |
          dotnet nuget push "$RUNNER_TEMP/nupkg/Logbird.$RELEASE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
          dotnet nuget push "$RUNNER_TEMP/nupkg/Logbird.$RELEASE_VERSION.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          url="https://api.nuget.org/v3-flatcontainer/logbird/$RELEASE_VERSION/logbird.$RELEASE_VERSION.nupkg"
          for attempt in $(seq 1 120); do
            if curl -sfI "$url" > /dev/null; then
              echo "Logbird $RELEASE_VERSION is available on nuget.org."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Logbird $RELEASE_VERSION was not available on nuget.org within an hour; Logbird.AspNetCore was not pushed. Rerun this job once it is."
          exit 1
      - name: Push Logbird.AspNetCore
        if: steps.gate.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "$RUNNER_TEMP/nupkg/Logbird.AspNetCore.$RELEASE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --no-symbols --skip-duplicate
          dotnet nuget push "$RUNNER_TEMP/nupkg/Logbird.AspNetCore.$RELEASE_VERSION.snupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
