name: Gitleaks

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The open-source CLI needs no organization license or repository secrets.
      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=8.30.1
          archive="gitleaks_${version}_linux_x64.tar.gz"
          checksums="gitleaks_${version}_checksums.txt"
          mkdir -p "$RUNNER_TEMP/gitleaks"
          cd "$RUNNER_TEMP/gitleaks"
          gh release download "v${version}" --repo gitleaks/gitleaks --pattern "$archive" --pattern "$checksums"
          grep " ${archive}$" "$checksums" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: Scan Git history
        run: gitleaks git --redact --no-banner .
