name: .NET SDK

# Scratch branch only (never merged): repeats the .NET Framework 4.8 suite to prove the delivered-count fix is stable,
# with a control run of master's unfixed core files to show the failure reproduces there.
on:
  pull_request:
    paths:
      - '.github/workflows/dotnet.yml'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  net48-fixed:
    name: net48 with the fix (runner ${{ matrix.shard }}, 10 runs)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: sdks/dotnet
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build tests/Logbird.Tests -c Release -f net48
      - name: Run the net48 suite 10 times
        run: |
          fails=0
          for i in $(seq 1 10); do
            if ! dotnet test tests/Logbird.Tests -c Release -f net48 --no-build > run.log 2>&1; then
              fails=$((fails+1)); grep -E "  Failed |Expected|Actual" run.log | head -6
            fi
            grep -E "Passed!|Failed!" run.log
          done
          echo "failures with the fix: $fails/10"
          test "$fails" -eq 0

  net48-control:
    name: net48 without the fix, control (runner ${{ matrix.shard }}, 10 runs)
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: sdks/dotnet
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore master's unfixed core files
        run: git checkout origin/master -- src/Logbird/LogbirdClient.cs src/Logbird/Internal/BatchSender.cs src/Logbird/Internal/EventQueue.cs && git status --short
      - run: dotnet build tests/Logbird.Tests -c Release -f net48
      - name: Run the net48 suite 10 times (reports, never fails)
        run: |
          fails=0
          for i in $(seq 1 10); do
            # The new deterministic test always fails on master's code; leave it out to measure the original flaky test.
            if ! dotnet test tests/Logbird.Tests -c Release -f net48 --no-build --filter "FullyQualifiedName!~mid_send" > run.log 2>&1; then
              fails=$((fails+1)); grep -E "  Failed |Expected|Actual" run.log | head -6
            fi
            grep -E "Passed!|Failed!" run.log
          done
          echo "failures without the fix: $fails/10"
