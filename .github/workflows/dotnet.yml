name: .NET SDK

on:
  pull_request:
    paths:
      - 'sdks/dotnet/**'
      - 'examples/aspnetcore/**'
      - 'packages/sdk/src/**'
      - 'packages/contracts/src/record-selector.ts'
      - 'packages/contracts/src/api.ts'
      - 'packages/contracts/src/query.ts'
      - '.github/workflows/dotnet.yml'
  push:
    branches: [master]
    paths:
      - 'sdks/dotnet/**'
      - 'examples/aspnetcore/**'
      - 'packages/sdk/src/**'
      - 'packages/contracts/src/record-selector.ts'
      - 'packages/contracts/src/api.ts'
      - 'packages/contracts/src/query.ts'
      - '.github/workflows/dotnet.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  dotnet:
    name: .NET build, test, pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet build Logbird.slnx -c Release
      # Unit tests on .NET 8 and .NET 10; the live-server tests skip without LOGBIRD_IT_* variables.
      - run: dotnet test Logbird.slnx -c Release --no-build
      - run: dotnet pack src/Logbird/Logbird.csproj -c Release --no-build -o ${{ runner.temp }}/nupkg
      - run: dotnet pack src/Logbird.AspNetCore/Logbird.AspNetCore.csproj -c Release --no-build -o ${{ runner.temp }}/nupkg
      - uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: ${{ runner.temp }}/nupkg
          retention-days: 7

  dotnet-framework:
    name: .NET Framework 4.8 tests
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Runs the netstandard2.0 build on .NET Framework.
      - run: dotnet test tests/Logbird.Tests -c Release -f net48

  wire-format:
    name: Wire format matches the TypeScript SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter . --filter @logbird/sdk --filter @logbird/contracts
      # Fails when the TypeScript SDK's wire JSON drifts from the golden file the .NET tests compare against.
      - run: pnpm exec tsx sdks/dotnet/tests/cross-sdk/typescript-envelope.ts --check
      # Fails when the TypeScript trailQuery output drifts from the golden file EventSearch.ForTrail is compared against.
      - run: pnpm exec tsx sdks/dotnet/tests/cross-sdk/trail-query.ts --check
      # Fails when the contracts' facet fields drift from the list FacetQuery checks fields against.
      - run: pnpm exec tsx sdks/dotnet/tests/cross-sdk/facet-fields.ts --check
