name: Docker

on:
  pull_request:
    paths:
      - 'apps/**/Dockerfile'
      - 'apps/web/Dockerfile.dockerignore'
      - 'docker-compose*.yml'
      - '.dockerignore'
      - '.github/workflows/docker.yml'
      - '.github/workflows/release.yml'

permissions:
  contents: read

concurrency:
  group: docker-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docker:
    name: Docker (${{ matrix.role }}${{ matrix.arch == 'arm64' && ', arm64' || '' }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        role: [server, worker, app, migrate, site]
        arch: [amd64, arm64]
        exclude:
          - {role: site, arch: arm64}
        include:
          - {role: server, dockerfile: apps/server/Dockerfile, target: runtime}
          - {role: worker, dockerfile: apps/worker/Dockerfile, target: runtime}
          - {role: app, dockerfile: apps/app/Dockerfile, target: runtime}
          - {role: migrate, dockerfile: apps/server/Dockerfile, target: migrate}
          - role: site
            dockerfile: apps/web/Dockerfile
            target: runtime
            build-args: |
              WEB_SITE_URL=https://site.example.com
              WEB_APP_URL=https://console.example.com
              WEB_GITHUB_URL=https://github.com/example/logbird
              WEB_GITHUB_PUBLIC=false
              WEB_ORG_NAME=Example
              WEB_SECURITY_EMAIL=security@example.com
              WEB_CONTACT_EMAIL=hello@example.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build without publishing
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/${{ matrix.arch }}
          push: false
          outputs: ${{ matrix.role == 'worker' && 'type=docker,name=logbird-worker:pr' || format('type=oci,dest={0}/logbird-{1}.tar', runner.temp, matrix.role) }}
          cache-from: type=gha,scope=pr-${{ matrix.role }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.role }}-${{ matrix.arch }}
      - name: Verify MessagePack in the worker image
        if: matrix.role == 'worker'
        run: |
          docker run --rm --pull=never --network=none --entrypoint node -i logbird-worker:pr --input-type=commonjs - <<'NODE'
          const assert = require('node:assert/strict');
          const { createRequire } = require('node:module');
          require('bullmq');
          const { Packr, isNativeAccelerationEnabled } = createRequire(require.resolve('bullmq'))('msgpackr');
          const packer = new Packr({ useRecords: false });
          const job = { name: 'image-smoke-test', data: { count: 1 } };
          assert.deepEqual(packer.unpack(packer.pack(job)), job);
          console.log(`BullMQ MessagePack round trip passed on ${process.version} (${process.arch}); native acceleration: ${isNativeAccelerationEnabled}`);
          NODE
