packages:
  - apps/*
  - packages/*
  - packages/integrations/*
  - examples/*

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true

nodeLinker: hoisted

onlyBuiltDependencies:
  - '@prisma/engines'
  - prisma
  - '@prisma/client'
  - esbuild
